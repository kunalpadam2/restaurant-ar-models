<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Menu</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
    }

    /* Top instruction overlay */
    #overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 15px;
      z-index: 999;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.5s;
    }

    /* Green locked badge */
    #locked-badge {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 180, 80, 0.9);
      color: white;
      padding: 10px 24px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 1s;
    }

    /* Rescan button */
    #rescan-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 107, 0, 0.92);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 15px;
      font-weight: 600;
      z-index: 999;
      display: none;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Loading screen */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: sans-serif;
      color: white;
      transition: opacity 0.5s;
    }

    #loader h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: 1px;
    }

    #loader p {
      font-size: 14px;
      color: #aaa;
      margin: 0 0 36px;
    }

    #progress-track {
      width: 220px;
      height: 4px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #ff6b00;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    #loader-status {
      font-size: 12px;
      color: #555;
      margin: 14px 0 0;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <h1>AR Menu</h1>
    <p>Preparing your experience...</p>
    <div id="progress-track">
      <div id="progress-bar"></div>
    </div>
    <p id="loader-status">Loading AR engine...</p>
  </div>

  <!-- Instruction overlay -->
  <div id="overlay">Point camera at the table card</div>

  <!-- Locked confirmation badge -->
  <div id="locked-badge">📍 Dish locked in place</div>

  <!-- Rescan button -->
  <button id="rescan-btn" onclick="resetAR()">🔄 Rescan Marker</button>

  <a-scene
    embedded
    mindar-image="
      imageTargetSrc: butter-chicken.mind;
      autoStart: true;
      uiLoading: no;
      uiError: no;
      uiScanning: no;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      missTolerance: 999;
      warmupTolerance: 2;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <a-asset-item id="food-model" src="butter-chicken.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" arjs-look-controls="enabled: false"></a-camera>

    <!-- MindAR tracked entity — used only for initial position detection -->
    <a-entity id="tracked-target" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="food-tracked"
        src="#food-model"
        position="0 0.1 0"
        rotation="0 0 0"
        scale="3 3 3"
        visible="false">
      </a-gltf-model>
    </a-entity>

    <!-- World-locked entity — takes over after first detection -->
    <a-entity id="world-anchor">
      <a-gltf-model
        id="food-locked"
        src="#food-model"
        position="0 0 0"
        rotation="0 0 0"
        scale="3 3 3"
        visible="false">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    // ─── Element references ───────────────────────────────────────────────────
    const scene         = document.querySelector('a-scene');
    const overlay       = document.getElementById('overlay');
    const badge         = document.getElementById('locked-badge');
    const rescanBtn     = document.getElementById('rescan-btn');
    const loader        = document.getElementById('loader');
    const progressBar   = document.getElementById('progress-bar');
    const loaderStatus  = document.getElementById('loader-status');
    const trackedTarget = document.getElementById('tracked-target');
    const foodTracked   = document.getElementById('food-tracked');
    const foodLocked    = document.getElementById('food-locked');

    let isLocked = false;
    let lockTimeout = null;

    // ─── Loading screen progress ──────────────────────────────────────────────
    let progress = 0;
    const progressInterval = setInterval(() => {
      if (progress < 85) {
        progress += Math.random() * 10;
        progressBar.style.width = Math.min(progress, 85) + '%';
      }
    }, 400);

    // ─── AR ready — hide loader ───────────────────────────────────────────────
    scene.addEventListener('arReady', () => {
      clearInterval(progressInterval);
      progressBar.style.width = '100%';
      loaderStatus.textContent = 'Ready — point at your table card';

      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
      }, 600);

      overlay.textContent = 'Point camera at the table card';
    });

    // ─── Marker found ─────────────────────────────────────────────────────────
    scene.addEventListener('targetFound', () => {
      if (isLocked) return;

      overlay.style.opacity = '0';
      foodTracked.setAttribute('visible', true);

      // Wait briefly for position to stabilise then lock
      lockTimeout = setTimeout(() => lockModel(), 600);
    });

    // ─── Marker lost — do nothing if already locked ───────────────────────────
    scene.addEventListener('targetLost', () => {
      if (isLocked) return;
      clearTimeout(lockTimeout);
      foodTracked.setAttribute('visible', false);
      overlay.style.opacity = '1';
    });

    // ─── Lock model in world space ────────────────────────────────────────────
    function lockModel() {
      if (isLocked) return;
      isLocked = true;

      // Capture exact world position, rotation and scale from tracked entity
      const worldPosition   = new THREE.Vector3();
      const worldQuaternion = new THREE.Quaternion();
      const worldScale      = new THREE.Vector3();
      trackedTarget.object3D.matrixWorld.decompose(
        worldPosition, worldQuaternion, worldScale
      );

      // Plant world anchor at that exact world position
      const anchor = document.getElementById('world-anchor');
      anchor.object3D.position.copy(worldPosition);
      anchor.object3D.quaternion.copy(worldQuaternion);

      // Show locked model, hide tracked model
      foodLocked.setAttribute('visible', true);
      foodTracked.setAttribute('visible', false);

      // Stop MindAR tracking entirely — saves battery
      const mindarSystem = scene.systems['mindar-image-system'];
      if (mindarSystem) mindarSystem.pause();

      // Show locked badge then fade out
      badge.style.display = 'block';
      badge.style.opacity = '1';
      setTimeout(() => {
        badge.style.opacity = '0';
        setTimeout(() => {
          badge.style.display = 'none';
          // Show rescan button after badge fades
          rescanBtn.style.display = 'block';
        }, 1000);
      }, 2500);

      overlay.style.display = 'none';
    }

    // ─── Reset and rescan ─────────────────────────────────────────────────────
    function resetAR() {
      isLocked = false;
      clearTimeout(lockTimeout);

      // Hide both models
      foodLocked.setAttribute('visible', false);
      foodTracked.setAttribute('visible', false);

      // Reset world anchor
      const anchor = document.getElementById('world-anchor');
      anchor.object3D.position.set(0, 0, 0);
      anchor.object3D.quaternion.set(0, 0, 0, 1);

      // Hide rescan button, show overlay
      rescanBtn.style.display = 'none';
      overlay.style.display = 'block';
      overlay.style.opacity = '1';
      overlay.textContent = 'Point camera at the table card';

      // Restart MindAR tracking
      const mindarSystem = scene.systems['mindar-image-system'];
      if (mindarSystem) mindarSystem.play();
    }
  </script>

</body>
</html>
