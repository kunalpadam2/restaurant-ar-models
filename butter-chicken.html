<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Butter Chicken AR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; width: 100%; height: 100%; }
    #overlay {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: white;
      padding: 10px 20px; border-radius: 24px;
      font-family: sans-serif; font-size: 15px;
      z-index: 999; text-align: center;
      pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="overlay">Point camera at the table card</div>

  <a-scene
    mindar-image="
      imageTargetSrc:butter-chicken.mind;
      autoStart: true;
      uiLoading: no;
      uiError: no;
      uiScanning: no;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      missTolerance: 20;
      warmupTolerance: 2;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <a-asset-item id="food-model" src="butter-chicken.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#food-model"
        position="0 0.5 0"
        rotation="90 90 90"
        scale="3 3 3">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
  const scene = document.querySelector('a-scene');
  const target = document.querySelector('[mindar-image-target]');
  const model = document.querySelector('a-gltf-model');
  const overlay = document.getElementById('overlay');

  let lastPosition = null;
  let lastRotation = null;

  scene.addEventListener('arReady', () => {
    overlay.textContent = 'Point camera at the table card';
  });

  scene.addEventListener('targetFound', () => {
    overlay.style.display = 'none';
    // Make model visible
    model.setAttribute('visible', true);
  });

  scene.addEventListener('targetLost', () => {
    // DON'T hide the model - freeze it in last position
    // Just silently wait for marker to come back
    // Only show overlay after a long delay
    setTimeout(() => {
      if (!target.object3D.visible) {
        overlay.style.display = 'block';
        overlay.textContent = 'Point camera at the table card';
      }
    }, 3000); // wait 3 seconds before showing the message
  });
</script>

</body>
</html>
